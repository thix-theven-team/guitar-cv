services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped

    ports:
      - "127.0.0.1:4500:4500"

    env_file: '.env'

    volumes:
      - ./data:/app/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=2).close()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s